name: Apply live IPP USB duplex proxy

on:
  push:
    branches:
      - experiment/android-print-probe
    paths:
      - tools/apply_live_ipp_bridge.py
      - .github/workflows/apply-live-ipp-bridge.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live IPP duplex patch
        run: python3 tools/apply_live_ipp_bridge.py

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Compile standalone Android print probe
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi \
            --warnings all \
            --output-dir /tmp/probe-build \
            experiments/android_print_probe

      - name: Commit verified source and remove temporary patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/android_print_probe
          git rm -f tools/apply_live_ipp_bridge.py .github/workflows/apply-live-ipp-bridge.yml
          git commit -m 'Add interactive live IPP over USB duplex proxy'
          git push origin HEAD:experiment/android-print-probe
