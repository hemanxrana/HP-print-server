name: Apply main PCL3GUI IPP service

on:
  push:
    branches: [main]
    paths:
      - tools/apply_main_pcl3_ipp.py
      - .github/workflows/apply-main-pcl3-ipp.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply main integration patch
        run: python3 tools/apply_main_pcl3_ipp.py
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
      - name: Compile main firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi \
            --warnings all \
            --output-dir /tmp/main-build \
            .
      - name: Commit verified integration and remove temporary patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino ipp_pcl3_service.h ipp_pcl3_service.cpp scanner_web.cpp usb_printer_backend.h
          git rm tools/apply_main_pcl3_ipp.py .github/workflows/apply-main-pcl3-ipp.yml
          git commit -m 'Add PCL3GUI-only IPP service to main'
          git push origin HEAD:main
