name: Apply PDL advertisement profiles

on:
  push:
    branches:
      - experiment/android-print-probe
    paths:
      - tools/add_pdl_profiles.py
      - .github/workflows/apply-pdl-profiles.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/android-print-probe
          fetch-depth: 0
      - name: Apply PDL dashboard patch
        run: python3 tools/add_pdl_profiles.py
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
      - name: Compile standalone Android print probe
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi \
            --warnings all \
            --output-dir /tmp/probe-build \
            experiments/android_print_probe
      - name: Commit verified source and remove temporary patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/add_pdl_profiles.py .github/workflows/apply-pdl-profiles.yml
          git add -A
          git commit -m 'Add switchable PCL3GUI and print-language profiles'
          git push origin HEAD:experiment/android-print-probe
