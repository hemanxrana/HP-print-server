name: Apply print stability batch

on:
  push:
    paths:
      - tools/apply_stability_batch.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply stability batch
        run: python3 tools/apply_stability_batch.py

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Compile ESP32-S3 firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 --warnings all --output-dir build .

      - name: Commit verified stability batch
        run: |
          rm -f tools/apply_stability_batch.py .github/workflows/apply-stability-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize long print jobs and completion tracking"
          git push origin HEAD:main
