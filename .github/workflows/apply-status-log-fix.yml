name: Apply status logging fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.comment.body == '/apply-status-log-fix' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch status logging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'  if \(millis\(\) - lastStatus > 5000\) \{.*?\n  \}\n\}',
              re.S,
          )

          replacement = '''  if (millis() - lastStatus > 1000) {
    lastStatus = millis();

    const int wifiState = (int)WiFi.status();
    const String ip = WiFi.localIP().toString();
    const int usbState = (int)usbHost.state();
    const String printerState = printerStateText();
    const bool rawConnected = usbPrinterBackend.rawClientConnected();
    const uint8_t usbPort =
        usbHost.portStatusValid() ? usbHost.portStatusValue() : 0;

    static bool initialized = false;
    static int lastWifiState = -1;
    static String lastIp;
    static int lastUsbState = -1;
    static String lastPrinterState;
    static bool lastRawConnected = false;
    static uint8_t lastUsbPort = 0;

    const bool changed =
        !initialized ||
        wifiState != lastWifiState ||
        ip != lastIp ||
        usbState != lastUsbState ||
        printerState != lastPrinterState ||
        rawConnected != lastRawConnected ||
        usbPort != lastUsbPort;

    if (changed) {
      Serial.printf(
          "[STATUS] WiFi=%d IP=%s USB=%d printer=%s raw=%s usbport=0x%02X\\n",
          wifiState,
          ip.c_str(),
          usbState,
          printerState.c_str(),
          rawConnected ? "connected" : "idle",
          usbPort);

      lastWifiState = wifiState;
      lastIp = ip;
      lastUsbState = usbState;
      lastPrinterState = printerState;
      lastRawConnected = rawConnected;
      lastUsbPort = usbPort;
      initialized = true;
    }
  }
}'''

          ns, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Expected status logging block was not found exactly once')
          p.write_text(ns, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git commit -m 'fix: log status only when changed'
          git push

          rm -f .github/workflows/apply-status-log-fix.yml .github/status-fix-trigger.txt
          git add -A
          git commit -m 'chore: remove one-shot status patch workflow'
          git push
