name: Clean dashboard descriptions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-dashboard-descriptions.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean section explanation and stale UI references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HP-print-server.ino')
          s=p.read_text()
          old='<div id="scanState" class="hint">Select a USB interface above. Wi-Fi scanning is independent of the USB interface.</div>'
          if old in s:
              s=s.replace(old,'',1)
          old="const b=$('scanBtn'),select=$('ssidSelect'),state=$('scanState');"
          s=s.replace(old,"const b=$('scanBtn'),select=$('ssidSelect');",1)
          s=s.replace(";state.textContent='Scanning nearby Wi-Fi networks…';",'',1)
          s=s.replace(";state.textContent='No visible Wi-Fi networks found.';",'',1)
          s=s.replace(";state.textContent=a.length+' nearby Wi-Fi network'+(a.length===1?'':'s')+' found.';",'',1)
          s=s.replace(";state.textContent='Scan failed. You can still enter a hidden SSID manually.';",'',1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Remove dashboard section explanation text'
            git push
          fi
