name: Cleanup dashboard subtitles
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  patch:
    if: github.event.issue.number == 10 && github.event.comment.body == '/apply-dashboard-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove section explanation text and fix scan syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')
          for text in [
              'Choose which USB interface is selected on the connected multifunction device. The scanner selection is kept separate from the printer path used for RAW 9100 printing.',
              'USB printer interface and RAW printing status',
              'USB printer state and connection details.',
              'Network connection and RAW 9100 service information.',
              'Connection and print-server status.',
          ]:
              s = s.replace('<p>' + text + '</p>', '')
          s = s.replace("b.textContent='Scanning…'select.innerHTML", "b.textContent='Scanning…';select.innerHTML")
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          if git diff --cached --quiet; then echo 'No dashboard changes needed'; exit 0; fi
          git commit -m 'Clean dashboard section descriptions'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 10 --repo '${{ github.repository }}' --comment 'Dashboard cleanup workflow completed.'
