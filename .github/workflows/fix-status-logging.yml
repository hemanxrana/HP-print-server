name: Apply status logging fix

on:
  push:
    paths:
      - '.github/workflows/fix-status-logging.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update serial status logging
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'if \(millis\(\) - lastStatus > 5000\) \{\n'
              r'  lastStatus = millis\(\);\n'
              r'  Serial\.printf\("\\\[STATUS\\\] WiFi=%d IP=%s USB=%d printer=%s raw=%s usbport=0x%02X\\\\n",\n'
              r'                \(int\)WiFi\.status\(\),\n'
              r'                WiFi\.localIP\(\)\.toString\(\)\.c_str\(\),\n'
              r'                \(int\)usbHost\.state\(\),\n'
              r'                printerStateText\(\)\.c_str\(\),\n'
              r'                usbPrinterBackend\.rawClientConnected\(\) \? "connected" : "idle",\n'
              r'                usbHost\.portStatusValid\(\) \? usbHost\.portStatusValue\(\) : 0\);\n'
              r'\}', re.MULTILINE)

          replacement = '''if (millis() - lastStatus > 1000) {
            lastStatus = millis();

            const int wifiState = (int)WiFi.status();
            const String ip = WiFi.localIP().toString();
            const int usbState = (int)usbHost.state();
            const String printerState = printerStateText();
            const bool rawConnected = usbPrinterBackend.rawClientConnected();
            const uint8_t usbPort =
                usbHost.portStatusValid() ? usbHost.portStatusValue() : 0;

            static bool initialized = false;
            static int lastWifiState = -1;
            static String lastIp;
            static int lastUsbState = -1;
            static String lastPrinterState;
            static bool lastRawConnected = false;
            static uint8_t lastUsbPort = 0;

            const bool changed =
                !initialized ||
                wifiState != lastWifiState ||
                ip != lastIp ||
                usbState != lastUsbState ||
                printerState != lastPrinterState ||
                rawConnected != lastRawConnected ||
                usbPort != lastUsbPort;

            if (changed) {
              Serial.printf(
                  "[STATUS] WiFi=%d IP=%s USB=%d printer=%s raw=%s usbport=0x%02X\\n",
                  wifiState,
                  ip.c_str(),
                  usbState,
                  printerState.c_str(),
                  rawConnected ? "connected" : "idle",
                  usbPort);

              lastWifiState = wifiState;
              lastIp = ip;
              lastUsbState = usbState;
              lastPrinterState = printerState;
              lastRawConnected = rawConnected;
              lastUsbPort = usbPort;
              initialized = true;
            }
          }'''

          new, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one old status block, found {n}')
          p.write_text(new, encoding='utf-8')
          PY

          git diff --check
          git diff -- HP-print-server.ino
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git commit -m 'Reduce repetitive serial status logging'
          git push
