name: Fix USB printer status bit decoding

on:
  push:
    paths:
      - '.github/workflows/fix-usb-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix USB Printer Class GET_PORT_STATUS masks
        shell: python
        run: |
          from pathlib import Path
          p = Path('usb_host_manager.cpp')
          s = p.read_text()
          old = '''  s.error = (value & 0x20) == 0;\n  s.selected = (value & 0x10) != 0;\n  s.paperEmpty = (value & 0x08) != 0;'''
          new = '''  // USB Printer Class GET_PORT_STATUS uses bit 5=paper empty,\n  // bit 4=selected, and bit 3=NOT error (1 means no error).\n  // The HP Smart Tank returns 0x18 when ready: selected + no error.\n  s.error = (value & 0x08) == 0;\n  s.selected = (value & 0x10) != 0;\n  s.paperEmpty = (value & 0x20) != 0;'''
          if old not in s:
              raise SystemExit('Expected status decoding block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit USB status fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usb_host_manager.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Fix USB printer status bit decoding'
          git push
