name: Move interface section

on:
  push:
    paths:
      - .github/workflows/move-interface-section-trigger.txt

permissions:
  contents: write

jobs:
  move-interface-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Wi-Fi and USB interface section to bottom
        shell: python
        run: |
          from pathlib import Path
          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')
          start_marker = '<section class="section glass">\n<h2>Wi-Fi &amp; USB Interface</h2>'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('Wi-Fi & USB Interface section not found')
          end = s.find('</section>', start)
          if end < 0:
              raise SystemExit('Wi-Fi & USB Interface section end not found')
          end += len('</section>')
          block = s[start:end]
          s2 = s[:start] + s[end:]
          body_end = s2.rfind('</main>')
          if body_end < 0:
              raise SystemExit('</main> not found')
          s2 = s2[:body_end] + block + '\n' + s2[body_end:]
          p.write_text(s2, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git diff --cached --quiet && { echo 'No change needed'; exit 0; }
          git commit -m 'Move Wi-Fi and USB interface to bottom of dashboard'
          git push
