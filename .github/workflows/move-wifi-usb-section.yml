name: Repair and place Wi-Fi USB interface controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-dashboard:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Repair dashboard markup and layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('HP-print-server.ino')
          s=p.read_text(encoding='utf-8')

          s=s.replace('\ndiv>\n\n<div class="sectionHead" style="margin-top:18px;margin-bottom:10px"><div><h2>Printer Status</h2>',
                      '\n\n<div class="sectionHead" style="margin-top:18px;margin-bottom:10px"><div><h2>Printer Status</h2>', 1)

          broken='''<div class="mode glass" aria-label="USB interface"><button id="scanMode" onclick="setInterfaceMode(\'scanner\')"><span class="modeIcon">⌕</span>Scanner interface</button><button id="printMode" class="active" onclick="setInterfaceMode(\'printer\')"><span class="modeIcon">▣</span>Printer interface</button>\n<div id="scanState"'''
          fixed='''<div class="mode glass" aria-label="USB interface"><button id="scanMode" onclick="setInterfaceMode(\'scanner\')"><span class="modeIcon">⌕</span>Scanner interface</button><button id="printMode" class="active" onclick="setInterfaceMode(\'printer\')"><span class="modeIcon">▣</span>Printer interface</button></div>\n<div id="scanState"'''
          s=s.replace(broken,fixed,1)

          p.write_text(s,encoding='utf-8')

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('HP-print-server.ino').read_text(encoding='utf-8')
          wifi=s.find('<div class="section glass"><div class="sectionHead"><div><h2>Wi-Fi &amp; USB Interface</h2>')
          end=s.find('</main><div id="toast" class="toast">')
          mode='<div class="mode glass" aria-label="USB interface">'
          assert wifi >= 0 and end > wifi
          assert mode in s[wifi:end]
          assert mode not in s[:wifi]
          assert '</button></div>\n<div id="scanState"' in s[wifi:end]
          assert '\ndiv>\n\n<div class="sectionHead"' not in s
          print('verified: toggle is inside Wi-Fi & USB Interface and markup is balanced')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git diff --cached --quiet || git commit -m 'Repair dashboard USB interface layout'
          git push
