name: Redesign dashboard Wi-Fi and USB interface sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign-dashboard:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Update dashboard layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')

          # Add dedicated interface-card styling while retaining the existing
          # Apple-like glass visual language.
          old_css = '.mode{display:flex;padding:4px;border-radius:16px;margin-bottom:15px;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.78);box-shadow:inset 0 1px 2px rgba(30,50,80,.08)}.mode button{flex:1;border:0;border-radius:12px;padding:10px 15px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer;transition:.18s}.mode button.active{background:var(--glass-strong);color:var(--text);box-shadow:0 4px 14px rgba(30,50,80,.11),inset 0 1px 0 #fff}.modeIcon{margin-right:6px}'
          new_css = old_css + '.interfaceList{display:grid;gap:10px}.interfaceCard{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.7);border-radius:19px;padding:16px;background:rgba(255,255,255,.34);color:var(--text);font:inherit;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s,background .16s}.interfaceCard:hover{transform:translateY(-1px);background:rgba(255,255,255,.5)}.interfaceCard.active{background:rgba(255,255,255,.76);border-color:rgba(0,122,255,.48);box-shadow:0 8px 24px rgba(0,122,255,.12),inset 0 1px 0 #fff}.interfaceTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.interfaceName{font-size:16px;font-weight:800;letter-spacing:-.015em}.interfaceBadge{font-size:11px;font-weight:800;color:var(--muted);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8)}.interfaceCard.active .interfaceBadge{color:var(--blue);background:rgba(0,122,255,.09);border-color:rgba(0,122,255,.15)}.interfaceDetails{margin-top:8px;font-size:12px;line-height:1.6;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:normal}.interfaceDescription{margin-top:5px;font-size:12px;color:var(--muted);font-family:inherit}'
          if old_css not in s:
              raise SystemExit('expected interface CSS was not found')
          s = s.replace(old_css, new_css, 1)

          # Compute the detailed interface descriptions from the enumerated
          # USB printer interface before rendering the dashboard.
          needle = '  const String deviceName = printerAttached && usbHost.device().product.length()\n      ? usbHost.device().product\n      : "HP USB printer";\n'
          insert = needle + '''  String printerInterfaceDetails = "Not detected";\n  if (printerAttached && usbHost.device().printer.found) {\n    const UsbPrinterInterfaceInfo &pi = usbHost.device().printer;\n    printerInterfaceDetails = String("IF ") + String(pi.interfaceNumber)\n        + " · ALT " + String(pi.alternateSetting)\n        + " · SUBCLASS 0x" + String(pi.subclass, HEX)\n        + " · PROTOCOL 0x" + String(pi.protocol, HEX)\n        + " · OUT 0x" + String(pi.bulkOut.address, HEX)\n        + " · IN 0x" + String(pi.bulkIn.address, HEX);\n  }\n  const String scannerInterfaceDetails = String("IF ") + String(USB_SCAN_INTERFACE)\n      + " · ALT " + String(USB_SCAN_ALT)\n      + " · fixed scanner selection";\n'''
          if needle not in s:
              raise SystemExit('dashboard device-name anchor was not found')
          s = s.replace(needle, insert, 1)

          start = s.find('<div class="section glass"><div class="sectionHead"><div><h2>Connection</h2></div></div><div class="infoGrid">')
          end = s.find('</main><div id="toast" class="toast">', start)
          if start < 0 or end < 0:
              raise SystemExit('dashboard Connection/Wi-Fi boundary was not found')

          replacement = '''<div class="section glass"><div class="sectionHead"><div><h2>Connection</h2><p>Select which USB interface the server should use. The selected interface is highlighted.</p></div></div>\n<div class="interfaceList">\n<button type="button" id="printMode" class="interfaceCard)HTML";
          replacement += scannerInterfaceSelected ? '"' : ' active"';
          replacement += ''' onclick="setInterfaceMode('printer')"><div class="interfaceTop"><span class="interfaceName">Printer</span><span class="interfaceBadge">)HTML";
          replacement += scannerInterfaceSelected ? 'Available' : 'Selected';
          replacement += '''</span></div><div class="interfaceDescription">USB Printer Class / RAW printing interface</div><div class="interfaceDetails">)HTML";
          replacement += esc(printerInterfaceDetails);
          replacement += '''</div></button>\n<button type="button" id="scanMode" class="interfaceCard)HTML";
          replacement += ' active' if scannerInterfaceSelected else '';
          replacement += '''" onclick="setInterfaceMode('scanner')"><div class="interfaceTop"><span class="interfaceName">Scanner</span><span class="interfaceBadge">)HTML";
          replacement += 'Selected' if scannerInterfaceSelected else 'Available';
          replacement += '''</span></div><div class="interfaceDescription">USB scanner interface selection</div><div class="interfaceDetails">)HTML";
          replacement += esc(scannerInterfaceDetails);
          replacement += '''</div></button>\n</div></div>\n\n<div class="section glass"><div class="sectionHead"><div><h2>Wi-Fi</h2><p>Configure the network connection independently from USB interface selection.</p></div><button class="btn secondary" id="scanBtn" onclick="scanWifi()">Scan Wi-Fi</button></div>\n<div class="selectWrap"><select id="ssidSelect"><option value="">Select a Wi-Fi network…</option></select></div>\n<form class="wifiForm" method="POST" action="/save"><div class="field"><label for="ssid">Wi-Fi network</label><input id="ssid" name="ssid" value=")HTML";
          replacement += esc(config.ssid);
          replacement += '''" maxlength="32" autocomplete="off" placeholder="Select a network or enter a hidden SSID"></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" placeholder="Leave blank to keep the saved password"></div><div class="actions"><button class="btn" type="submit">Save Wi-Fi &amp; restart</button><span class="hint">Hidden networks can be entered manually.</span></div></form></div>\n\n</main><div id="toast" class="toast">'''

          s = s[:start] + replacement + s[end + len('</main><div id="toast" class="toast">'):]

          # The interface cards use the existing IDs, so the JS selection
          # logic remains compatible; only the active class is now applied to
          # the full card rather than a segmented control.
          old_js = "function setInterfaceButtons(){const scanner=interfaceMode==='scanner';$('scanMode').classList.toggle('active',scanner);$('printMode').classList.toggle('active',!scanner);}"
          new_js = "function setInterfaceButtons(){const scanner=interfaceMode==='scanner';$('scanMode').classList.toggle('active',scanner);$('printMode').classList.toggle('active',!scanner);$('scanMode').querySelector('.interfaceBadge').textContent=scanner?'Selected':'Available';$('printMode').querySelector('.interfaceBadge').textContent=scanner?'Available':'Selected';}"
          if old_js not in s:
              raise SystemExit('interface button JS anchor was not found')
          s = s.replace(old_js, new_js, 1)

          # Fix the Wi-Fi scan status element typo while touching this UI.
          s = s.replace("state.textContent=a.length+' nearby Wi-Fi network'+(a.length===1?'':'s')+' found.'", "$('scanState').textContent=a.length+' nearby Wi-Fi network'+(a.length===1?'':'s')+' found.';$('scanState').style.display='block'", 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify dashboard structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('HP-print-server.ino').read_text(encoding='utf-8')
          connection = s.find('<h2>Connection</h2>')
          wifi = s.find('<h2>Wi-Fi</h2>')
          assert connection >= 0 and wifi > connection
          assert '<span class="interfaceName">Printer</span>' in s[connection:wifi]
          assert '<span class="interfaceName">Scanner</span>' in s[connection:wifi]
          assert 'printerInterfaceDetails' in s
          assert 'scannerInterfaceDetails' in s
          assert 'class="interfaceCard' in s[connection:wifi]
          assert '<h2>Wi-Fi &amp; USB Interface</h2>' not in s
          assert 'Wi-Fi &amp; USB Interface' not in s
          assert 'setInterfaceButtons(){const scanner=interfaceMode===\'scanner\'' in s
          print('verified: Wi-Fi is separate; Printer and Scanner are selectable interface cards under Connection')
          PY

      - name: Commit dashboard redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino .github/workflows/move-wifi-usb-section.yml
          git diff --cached --quiet || git commit -m 'Redesign dashboard Wi-Fi and USB interface layout'
          git push
