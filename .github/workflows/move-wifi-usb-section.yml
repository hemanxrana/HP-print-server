name: Move Wi-Fi USB section to bottom

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  move-section:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Move USB interface toggle into Wi-Fi & USB Interface
        shell: python
        run: |
          from pathlib import Path
          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')

          mode = '''<div class="mode glass" aria-label="USB interface"><button id="scanMode" onclick="setInterfaceMode('scanner')"><span class="modeIcon">⌕</span>Scanner interface</button><button id="printMode" class="active" onclick="setInterfaceMode('printer')"><span class="modeIcon">▣</span>Printer interface</button></div>'''
          if mode not in s:
              raise SystemExit('USB interface toggle not found, or it is already moved')
          s = s.replace(mode + '\n\n', '', 1)

          wifi = '<div class="section glass"><div class="sectionHead"><div><h2>Wi-Fi &amp; USB Interface</h2></div><button class="btn secondary" id="scanBtn" onclick="scanWifi()">Scan Wi-Fi</button></div>'
          if wifi not in s:
              raise SystemExit('Wi-Fi & USB Interface section not found')

          insert = wifi + '''\n<div class="label" style="margin-bottom:8px">USB Interface</div>\n''' + mode
          s = s.replace(wifi, insert, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify dashboard layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('HP-print-server.ino').read_text(encoding='utf-8')
          wifi=s.find('<div class="section glass"><div class="sectionHead"><div><h2>Wi-Fi &amp; USB Interface</h2>')
          end=s.find('</main><div id="toast" class="toast">')
          mode='<div class="mode glass" aria-label="USB interface">'
          assert wifi >= 0 and end > wifi
          inside=s[wifi:end]
          assert mode in inside
          assert 'USB Interface</div>' in inside
          assert s.find(mode) > wifi
          assert s.find(mode) < end
          assert s.find(mode) == s.find(mode, wifi)
          print('verified: USB interface toggle is inside the bottom Wi-Fi & USB Interface section')
          PY

      - name: Commit change to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git diff --cached --quiet || git commit -m 'Move USB interface toggle into Wi-Fi settings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
