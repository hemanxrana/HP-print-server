name: Clean dashboard section descriptions
on:
  push:
    paths:
      - .github/workflows/ui-subtitles-cleanup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove section descriptions and restore headings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HP-print-server.ino')
          s = p.read_text(encoding='utf-8')
          old = '<div class="section glass"><div class="sectionHead"><div><p>Choose which USB interface is selected on the connected multifunction device. Scanner uses IF 0 / ALT 0; printer uses IF 1 / ALT 0.</p></div><button class="btn secondary" id="scanBtn" onclick="scanWifi()">Scan Wi-Fi</button></div>'
          new = '<div class="section glass"><div class="sectionHead"><div><h2>Wi-Fi &amp; USB Interface</h2></div><button class="btn secondary" id="scanBtn" onclick="scanWifi()">Scan Wi-Fi</button></div>'
          if old not in s:
              raise SystemExit('Expected Wi-Fi/interface section description was not found')
          s = s.replace(old, new, 1)
          old = '<div class="grid" style="margin-top:14px">'
          new = '<div class="sectionHead" style="margin-top:18px;margin-bottom:10px"><div><h2>Printer Status</h2></div></div>\n<div class="grid">'
          if old not in s:
              raise SystemExit('Expected printer status grid was not found')
          s = s.replace(old, new, 1)
          old = '<div class="section glass"><div class="infoGrid">'
          new = '<div class="section glass"><div class="sectionHead"><div><h2>Connection</h2></div></div><div class="infoGrid">'
          if old not in s:
              raise SystemExit('Expected connection section was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit dashboard cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HP-print-server.ino
          git diff --cached --quiet && exit 0
          git commit -m 'Clean up dashboard section descriptions'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/ui-subtitles-cleanup.yml || true
          git commit -m 'Remove temporary dashboard cleanup workflow' || true
          git push || true
